# ---------------------------------------------------------------------------
# API REST para la Administracion de Usuarios
# Universidad Tecnologica del Norte de Guanajuato (UTNG)
# Asignatura: Introduccion a Aplicaciones Web Progresivas (PWA) - Unidad I
# ---------------------------------------------------------------------------
server:
  port: 8080
  error:
    # El detalle de los errores lo arma GlobalExceptionHandler; la pagina de
    # error de Spring nunca debe filtrar trazas ni mensajes internos.
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

spring:
  application:
    name: administracion-usuarios-api
  datasource:
    url: ${DB_URL:}
    username: ${DB_USUARIO:}
    password: ${DB_CLAVE:}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: PoolUsuarios
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      # "update" mantiene el esquema sincronizado durante el desarrollo.
      # En una revision formal puede cambiarse a "validate" y crear el esquema
      # con scripts/01-esquema-postgresql.sql.
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 25
          time_zone: America/Mexico_City

  jackson:
    serialization:
      write-dates-as-timestamps: false
      indent-output: true
    default-property-inclusion: always

# Documentacion de los servicios
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

# Parametros propios de la aplicacion
app:
  paginacion:
    tamanio-por-defecto: 10
    tamanio-maximo: 50

logging:
  level:
    root: INFO
    com.utng.usuarios: INFO
